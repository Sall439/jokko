# Configuration nginx du conteneur frontend JokkoDentiste.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité de base
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Compression des ressources texte
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Proxy des appels API vers le service Docker Compose nommé « api »
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cache long pour les ressources versionnées par Vite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Application monopage : toutes les routes renvoient index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
